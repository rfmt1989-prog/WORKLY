name: Validate Premium Product Polish

on:
  push:
    branches:
      - agent/compliance-session-refresh
    paths:
      - scripts/apply_premium_copy_polish.py
      - scripts/apply_visual_tokens.py
      - .github/workflows/premium-polish-validation.yml
      - frontend/src/components/workspace/premiumCopy.ts

permissions:
  contents: write

env:
  PYTHONPATH: .

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/compliance-session-refresh
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply premium copy polish
        run: python scripts/apply_premium_copy_polish.py
      - name: Apply visual tokens
        run: python scripts/apply_visual_tokens.py
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Backend tests
        run: pytest -q backend/tests
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Export web
        working-directory: frontend
        run: npm run build:web
      - name: Commit final product polish and remove tooling
        run: |
          git config user.name "WORKLY Agent"
          git config user.email "actions@users.noreply.github.com"
          git add frontend docs
          git rm scripts/apply_premium_copy_polish.py scripts/apply_visual_tokens.py .github/workflows/premium-polish-validation.yml
          git commit -m "Polish premium navigation, i18n and visual system"
          git push origin HEAD:agent/compliance-session-refresh

# Trigger validation after premium dashboard consolidation.
