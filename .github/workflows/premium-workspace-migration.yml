name: Build Premium Workspace

on:
  push:
    branches:
      - agent/compliance-session-refresh
    paths:
      - scripts/apply_premium_workspace.py
      - .github/workflows/premium-workspace-migration.yml
      - frontend/src/components/workspace/PremiumDashboardView.tsx
      - frontend/src/components/workspace/WorkspaceMoreMenu.tsx

permissions:
  contents: write

env:
  PYTHONPATH: .

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/compliance-session-refresh
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply premium workspace integration
        run: python scripts/apply_premium_workspace.py
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Backend tests
        run: pytest -q backend/tests
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Export web
        working-directory: frontend
        run: npm run build:web
      - name: Commit product changes and remove migration tooling
        run: |
          git config user.name "WORKLY Agent"
          git config user.email "actions@users.noreply.github.com"
          git add frontend docs
          git rm scripts/apply_premium_workspace.py .github/workflows/premium-workspace-migration.yml
          git commit -m "Consolidate premium workspace navigation and dashboard"
          git push origin HEAD:agent/compliance-session-refresh
