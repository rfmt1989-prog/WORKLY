name: Backend Verify

on:
  pull_request:
    paths:
      - "backend/**"
      - "api/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "vercel.json"
      - ".github/workflows/backend-verify.yml"
      - "scripts/apply_timesheet_backend.py"
  push:
    branches:
      - "agent/**"
    paths:
      - "backend/**"
      - "api/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "vercel.json"
      - ".github/workflows/backend-verify.yml"
      - "scripts/apply_timesheet_backend.py"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/timesheets-approval
          fetch-depth: 0

      - name: Apply timesheet backend migration
        run: |
          if [ -f scripts/apply_timesheet_backend.py ]; then
            python scripts/apply_timesheet_backend.py
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest httpx

      - name: Compile backend
        env:
          PYTHONPATH: .
        run: python -m compileall -q backend api

      - name: Test backend
        env:
          PYTHONPATH: .
        run: pytest -q backend/tests

      - name: Materialize validated backend
        if: github.event_name == 'pull_request' && hashFiles('scripts/apply_timesheet_backend.py') != ''
        run: |
          git config user.name "WORKLY Agent"
          git config user.email "actions@users.noreply.github.com"
          git add backend
          git rm scripts/apply_timesheet_backend.py .github/workflows/timesheet-backend-migrate.yml
          git checkout origin/main -- .github/workflows/backend-verify.yml
          git add .github/workflows/backend-verify.yml
          git commit -m "Add timesheet approval backend"
          git push origin HEAD:agent/timesheets-approval
