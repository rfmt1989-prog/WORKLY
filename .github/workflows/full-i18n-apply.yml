name: Full i18n migration

on:
  push:
    branches:
      - agent/full-i18n

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/full-i18n
          fetch-depth: 0

      - name: Apply full translation migration
        run: python scripts/apply_full_i18n.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Export web
        working-directory: frontend
        run: npm run build:web

      - name: Commit verified migration
        run: |
          if git diff --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git config user.name "rfmt1989-prog"
          git config user.email "300776272+rfmt1989-prog@users.noreply.github.com"
          git add frontend
          git commit -m "Translate complete WORKLY experience across seven languages"
          git push origin HEAD:agent/full-i18n
