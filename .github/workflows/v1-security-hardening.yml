name: Build V1 Security Hardening

on:
  push:
    branches:
      - agent/v1-security-hardening
    paths:
      - scripts/apply_v1_security_hardening.py
      - .github/workflows/v1-security-hardening.yml

permissions:
  contents: write

env:
  PYTHONPATH: .

jobs:
  harden-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1-security-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply security hardening
        run: python scripts/apply_v1_security_hardening.py
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Compile backend
        run: python -m compileall -q backend api
      - name: Test backend
        run: pytest -q backend/tests
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Apply non-breaking dependency security fixes
        working-directory: frontend
        run: npm audit fix --omit=dev
      - name: Report remaining production advisories
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --audit-level=high
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::warning title=Expo upstream advisories remain::Remaining advisories require breaking Expo/Router upgrades; no --force upgrade is applied in V1."
          fi
          exit 0
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Export web
        working-directory: frontend
        run: npm run build:web
      - name: Commit product changes and remove migration tooling
        run: |
          git config user.name "WORKLY Agent"
          git config user.email "actions@users.noreply.github.com"
          git add backend frontend vercel.json
          git rm scripts/apply_v1_security_hardening.py .github/workflows/v1-security-hardening.yml
          git commit -m "Harden WORKLY V1 production security"
          git push origin HEAD:agent/v1-security-hardening
