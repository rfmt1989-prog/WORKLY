name: Build Compliance Center

on:
  push:
    branches:
      - agent/compliance-center
    paths:
      - scripts/apply_compliance_center.py
      - .github/workflows/compliance-center-migration.yml

permissions:
  contents: write

env:
  PYTHONPATH: .

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/compliance-center
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply compliance integration
        run: python scripts/apply_compliance_center.py
      - name: Normalize compliance avatar props
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/components/workspace/ComplianceView.tsx')
          text = path.read_text().replace(' uri={row.worker_avatar}', '')
          path.write_text(text)
          PY
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Compile backend
        run: python -m compileall -q backend api
      - name: Backend tests
        run: pytest -q backend/tests
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Export web
        working-directory: frontend
        run: npm run build:web
      - name: Commit product changes and remove migration tooling
        run: |
          git config user.name "WORKLY Agent"
          git config user.email "actions@users.noreply.github.com"
          git add backend frontend
          git rm scripts/apply_compliance_center.py .github/workflows/compliance-center-migration.yml
          git commit -m "Add compliance center and check-in enforcement"
          git push origin HEAD:agent/compliance-center
