name: Timesheet Backend Migration

on:
  push:
    branches:
      - agent/timesheets-approval
    paths:
      - scripts/apply_timesheet_backend.py
      - .github/workflows/timesheet-backend-migrate.yml

permissions:
  contents: write

env:
  PYTHONPATH: .

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/timesheets-approval
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply backend migration
        run: python scripts/apply_timesheet_backend.py
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Test backend
        run: pytest -q backend/tests
      - name: Commit validated backend and remove temporary tooling
        run: |
          git config user.name "WORKLY Agent"
          git config user.email "actions@users.noreply.github.com"
          git add backend
          git rm scripts/apply_timesheet_backend.py .github/workflows/timesheet-backend-migrate.yml
          git commit -m "Add timesheet approval backend"
          git push origin HEAD:agent/timesheets-approval

# trigger backend migration
