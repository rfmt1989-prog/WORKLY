name: Provision WORKLY Neon

on:
  push:
    branches:
      - agent/neon-plan-probe

permissions:
  contents: read

env:
  VERCEL_ORG_ID: team_5LSRDYKDIDDttNfiidfjplCI
  VERCEL_PROJECT_ID: prj_i2O5wxHnnL3WaI4OstDogjOBEpFg

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Link project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Provision free Neon PostgreSQL
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -e
          EXISTING="$(vercel integration list --format=json --token="$VERCEL_TOKEN")"
          if printf '%s' "$EXISTING" | grep -q 'workly-postgres'; then
            echo 'workly-postgres already exists; skipping creation.'
          else
            vercel integration add neon \
              --name workly-postgres \
              --plan free_v3 \
              --metadata region=fra1 \
              --metadata auth=false \
              --environment production \
              --format=json \
              --token="$VERCEL_TOKEN"
          fi
      - name: Verify resource and environment variable names
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo '--- RESOURCES ---'
          vercel integration list --format=json --token="$VERCEL_TOKEN"
          echo '--- PRODUCTION ENV NAMES ---'
          vercel env ls production --token="$VERCEL_TOKEN"
