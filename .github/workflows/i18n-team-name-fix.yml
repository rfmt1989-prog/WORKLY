name: Fix descriptive team names

on:
  push:
    branches:
      - agent/i18n-residue-audit
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/i18n-residue-audit
          fetch-depth: 0

      - name: Apply i18n corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Missing expected text in {path}: {old}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          p = Path('frontend/src/demo/localizedData.ts')
          text = p.read_text(encoding='utf-8')
          marker = '  "Montagem e coordenação": ["Assembly and coordination", "Montage et coordination", "Montaje y coordinación", "Montaj și coordonare", "Montage und Koordination", "Montage en coördinatie"],\n'
          additions = (
              '  "Equipa Estrutura Alfa": ["Alpha Structure Team", "Équipe Structure Alpha", "Equipo Estructura Alfa", "Echipa Structură Alfa", "Team Struktur Alpha", "Team Structuur Alfa"],\n'
              '  "Equipa Operações Norte": ["North Operations Team", "Équipe Opérations Nord", "Equipo Operaciones Norte", "Echipa Operațiuni Nord", "Einsatzteam Nord", "Team Operaties Noord"],\n'
          )
          if '"Equipa Estrutura Alfa"' not in text:
              if marker not in text:
                  raise SystemExit('localizedData insertion marker missing')
              text = text.replace(marker, additions + marker)
              p.write_text(text, encoding='utf-8')

          path = 'frontend/src/components/workspace/TeamsView.tsx'
          replace(path, 'title={selectedTeam?.name ?? ""}', 'title={localizeDemoText(language, selectedTeam?.name)}')
          replace(path, 'subtitle={selectedTeam?.specialty}', 'subtitle={localizeDemoText(language, selectedTeam?.specialty)}')
          replace(path, 'subtitle={selectedTeam?.name}', 'subtitle={localizeDemoText(language, selectedTeam?.name)}')
          replace(path, 'accessibilityLabel={team.name}', 'accessibilityLabel={localizeDemoText(language, team.name)}')
          replace(path, '<Text style={styles.teamName}>{team.name}</Text>', '<Text style={styles.teamName}>{localizeDemoText(language, team.name)}</Text>')
          replace(path, 'value={form.name}\n        onChangeText={(value) => setValue("name", value)}', 'value={localizeDemoText(language, form.name)}\n        onChangeText={(value) => setValue("name", value)}')
          replace(path, '<Text style={styles.detailTitle}>{team.name}</Text>', '<Text style={styles.detailTitle}>{localizeDemoText(language, team.name)}</Text>')

          # Guard the screenshot regression and every visible rendering of the demo team names.
          body = Path(path).read_text(encoding='utf-8')
          forbidden = [
              '<Text style={styles.teamName}>{team.name}</Text>',
              '<Text style={styles.detailTitle}>{team.name}</Text>',
              'title={selectedTeam?.name ?? ""}',
              'subtitle={selectedTeam?.specialty}',
          ]
          for item in forbidden:
              if item in body:
                  raise SystemExit(f'Unlocalized team field remains: {item}')

          catalog = Path('frontend/src/demo/localizedData.ts').read_text(encoding='utf-8')
          for expected in ['Echipa Structură Alfa', 'Echipa Operațiuni Nord']:
              if expected not in catalog:
                  raise SystemExit(f'Missing Romanian demo translation: {expected}')

          print('Active workspace team-name i18n corrections applied.')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Export web
        working-directory: frontend
        run: npm run build:web

      - name: Commit verified correction
        run: |
          rm -f .github/workflows/i18n-residue-audit.yml .github/workflows/i18n-team-name-fix.yml
          git config user.name "rfmt1989-prog"
          git config user.email "300776272+rfmt1989-prog@users.noreply.github.com"
          git add frontend/src/demo/localizedData.ts frontend/src/components/workspace/TeamsView.tsx .github/workflows
          git commit -m "Translate descriptive demo team names" || exit 0
          git push origin HEAD:agent/i18n-residue-audit
