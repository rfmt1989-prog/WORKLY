name: Build Company Access Control

on:
  push:
    branches:
      - agent/company-access-control
    paths:
      - scripts/apply_company_access.py
      - .github/workflows/company-access-migration.yml

permissions:
  contents: write

env:
  PYTHONPATH: .

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/company-access-control
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Harden migration script
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_company_access.py')
          text = path.read_text()
          old = r"        rf'@app\.(?:get|post|patch|delete)\(.*?\)\ndef {name}\(.*?(?=\n\n@app\.)',"
          new = r"        rf'@app\.(?:get|post|patch|delete)\([^\n]*\)\ndef {name}\(.*?(?=\n\n@app\.)',"
          if old not in text:
              raise SystemExit('Could not patch endpoint selector')
          text = text.replace(old, new, 1)
          for source, target in (
              ('/company/members/{member_id}', '/company/members/{{member_id}}'),
              ('/workers/{worker_id}', '/workers/{{worker_id}}'),
              ('/companies/{company_id}', '/companies/{{company_id}}'),
              ('/projects/{project_id}', '/projects/{{project_id}}'),
              ('maria@workly.test', 'maria.access@worklyapp.com'),
              ('rh@workly.test', 'rh.access@worklyapp.com'),
          ):
              text = text.replace(source, target)
          path.write_text(text)
          PY
      - name: Apply integration
        run: python scripts/apply_company_access.py
      - name: Normalize React Native font weight
        run: sed -i 's/fontWeight: "850"/fontWeight: "800"/g' frontend/src/components/workspace/AccessView.tsx
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Compile backend
        run: python -m compileall -q backend api
      - name: Backend tests
        run: pytest -q backend/tests
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Export web
        working-directory: frontend
        run: npm run build:web
      - name: Commit integration
        run: |
          git config user.name "WORKLY Agent"
          git config user.email "actions@users.noreply.github.com"
          git add backend frontend
          git commit -m "[access-generated] Add multi-company roles and permissions"
          git push origin HEAD:agent/company-access-control
