def test_demo_company_is_admin(client, company_auth):
    response = client.get("/api/company/access", headers=company_auth["headers"])
    assert response.status_code == 200, response.text
    payload = response.json()
    assert payload["current_role"] == "admin"
    assert "access.manage" in payload["permissions"]
    assert payload["members"][0]["user_id"] == company_auth["user"]["id"]


def test_company_admin_can_invite_and_invited_user_joins_same_company(client, company_auth):
    invite = client.post(
        "/api/company/invitations",
        headers=company_auth["headers"],
        json={"name": "Maria Costa", "email": "maria@workly.test", "access_role": "hr"},
    )
    assert invite.status_code == 200, invite.text
    token = invite.json()["token"]

    registered = client.post(
        "/api/auth/register",
        json={
            "name": "Maria Costa",
            "email": "maria@workly.test",
            "password": "StrongPass123!",
            "user_type": "company",
            "invite_token": token,
        },
    )
    assert registered.status_code == 200, registered.text
    user = registered.json()["user"]
    assert user["company_id"] == company_auth["user"]["company_id"]
    assert user["company_role"] == "hr"
    assert "workers.manage" in user["permissions"]
    assert "projects.manage" not in user["permissions"]


def test_hr_cannot_create_projects_but_can_read_workers(client, company_auth):
    invite = client.post(
        "/api/company/invitations",
        headers=company_auth["headers"],
        json={"name": "RH User", "email": "rh@workly.test", "access_role": "hr"},
    ).json()
    registration = client.post(
        "/api/auth/register",
        json={
            "name": "RH User",
            "email": "rh@workly.test",
            "password": "StrongPass123!",
            "user_type": "company",
            "invite_token": invite["token"],
        },
    ).json()
    headers = {"Authorization": f"Bearer {registration['access_token']}"}

    workers = client.get("/api/workers", headers=headers)
    assert workers.status_code == 200, workers.text

    project = client.post(
        "/api/projects",
        headers=headers,
        json={
            "name": "Blocked project",
            "location": "Porto",
            "start_date": "2026-08-01",
            "end_date": "2026-09-01",
        },
    )
    assert project.status_code == 403


def test_company_cannot_read_foreign_project_by_id(client, company_auth):
    from backend.app import main

    with main._state_lock:
        foreign = dict(main._state["projects"][0])
        foreign["id"] = "project-foreign"
        foreign["company_id"] = "company-other"
        main._state["projects"].append(foreign)

    response = client.get("/api/projects/project-foreign", headers=company_auth["headers"])
    assert response.status_code == 403


def test_company_cannot_read_foreign_worker_by_id(client, company_auth):
    from backend.app import main

    with main._state_lock:
        foreign = dict(main._state["workers"][0])
        foreign["id"] = "worker-foreign"
        foreign["company_id"] = "company-other"
        main._state["workers"].append(foreign)

    response = client.get("/api/workers/worker-foreign", headers=company_auth["headers"])
    assert response.status_code == 403
