name: Build Real Document Storage

on:
  push:
    branches:
      - agent/real-document-storage
    paths:
      - scripts/apply_real_document_storage.py
      - .github/workflows/real-document-storage.yml

permissions:
  contents: write

env:
  PYTHONPATH: .

jobs:
  integrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/real-document-storage
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply real document storage integration
        run: python scripts/apply_real_document_storage.py
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Compile backend
        run: python -m compileall -q backend api
      - name: Test backend
        run: pytest -q backend/tests
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Expo document dependencies
        working-directory: frontend
        run: npx expo install expo-document-picker expo-file-system expo-sharing
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Export web
        working-directory: frontend
        run: npm run build:web
      - name: Commit product changes and remove migration tooling
        run: |
          git config user.name "WORKLY Agent"
          git config user.email "actions@users.noreply.github.com"
          git add backend frontend
          git rm scripts/apply_real_document_storage.py .github/workflows/real-document-storage.yml
          git commit -m "Add authenticated real document storage"
          git push origin HEAD:agent/real-document-storage
