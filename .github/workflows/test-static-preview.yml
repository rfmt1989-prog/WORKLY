name: Test Static Routing Preview

on:
  push:
    branches:
      - agent/test-static-routing

permissions:
  contents: read

env:
  VERCEL_ORG_ID: team_5LSRDYKDIDDttNfiidfjplCI
  VERCEL_PROJECT_ID: prj_i2O5wxHnnL3WaI4OstDogjOBEpFg
  PREVIEW_URL: https://workly-demo-h6quadnwn-rfmt1989-8687s-projects.vercel.app

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global vercel@latest
      - run: vercel pull --yes --environment=preview

      - name: Verify frontend and API routing
        shell: bash
        run: |
          root="$(vercel curl / --deployment "$PREVIEW_URL")"
          login="$(vercel curl /login --deployment "$PREVIEW_URL")"
          workspace="$(vercel curl /workspace --deployment "$PREVIEW_URL")"
          health="$(vercel curl /api/health --deployment "$PREVIEW_URL")"
          asset="$(vercel curl /_expo/static/js/web/entry-2f6263c107f351f8326b44aa963f8355.js --deployment "$PREVIEW_URL")"

          grep -q '<title>WORKLY</title>' <<< "$root"
          grep -q 'entry-2f6263c107f351f8326b44aa963f8355.js' <<< "$root"
          grep -q '<title>WORKLY</title>' <<< "$login"
          grep -q '<title>WORKLY</title>' <<< "$workspace"
          grep -q '"status":"ok"' <<< "$health"
          grep -q 'WORKLY API' <<< "$health"
          test "${#asset}" -gt 1000000

          echo "Frontend HTML: OK"
          echo "Expo bundle: OK (${#asset} bytes)"
          echo "FastAPI health: OK"
