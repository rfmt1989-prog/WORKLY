name: Wire company operations map

on:
  push:
    branches:
      - "agent/company-operations-map"
    paths:
      - ".github/workflows/apply-operations-map.yml"

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/company-operations-map

      - name: Wire operations navigation
        run: |
          python - <<'PY'
          from pathlib import Path

          map_path = Path("frontend/src/components/workspace/OperationsMapView.tsx")
          map_text = map_path.read_text(encoding="utf-8")
          old_style = 'style={[styles.mapCard, compact ? styles.mapCardCompact : null]}'
          new_style = 'style={compact ? [styles.mapCard, styles.mapCardCompact] : styles.mapCard}'
          if old_style not in map_text:
              raise SystemExit("Operations map style anchor not found")
          map_path.write_text(map_text.replace(old_style, new_style, 1), encoding="utf-8")

          path = Path("frontend/src/components/workspace/ImmersiveWorkspaceShell.tsx")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  'import { DocumentsView } from "./DocumentsView";\n',
                  'import { DocumentsView } from "./DocumentsView";\nimport { OperationsMapView } from "./OperationsMapView";\n',
              ),
              (
                  '    { id: "dashboard", label: t.dashboard, icon: "grid-outline" },\n',
                  '    { id: "dashboard", label: t.dashboard, icon: "grid-outline" },\n    {\n      id: "operations",\n      label: language === "pt" ? "Operações" : "Operations",\n      icon: "map-outline",\n      companyOnly: true,\n    },\n',
              ),
              (
                  '    switch (activeSection) {\n      case "workers":\n',
                  '    switch (activeSection) {\n      case "operations":\n        return <OperationsMapView />;\n      case "workers":\n',
              ),
              (
                  '            language === "pt" ? "Abrir presenças" : "Open attendance"\n          }\n          onPress={() => navigate("attendance")}\n',
                  '            role === "company"\n              ? language === "pt"\n                ? "Abrir mapa operacional"\n                : "Open operations map"\n              : language === "pt"\n                ? "Abrir presenças"\n                : "Open attendance"\n          }\n          onPress={() => navigate(role === "company" ? "operations" : "attendance")}\n',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"Anchor not found: {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Export web
        working-directory: frontend
        run: npm run build:web

      - name: Commit operations map wiring
        run: |
          git config user.name "WORKLY Automation"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/src/components/workspace/OperationsMapView.tsx frontend/src/components/workspace/ImmersiveWorkspaceShell.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Wire company operations map"
            git push origin agent/company-operations-map
          fi
