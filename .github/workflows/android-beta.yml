name: Android Beta APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workly-android-beta
  cancel-in-progress: false

jobs:
  android-beta:
    name: Build WORKLY Android preview
    runs-on: ubuntu-latest
    environment: android-beta
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "1"
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_API_URL: ${{ vars.WORKLY_TEST_API_URL }}
      EAS_NO_VCS: "0"
    steps:
      - name: Verify isolated beta configuration
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Set EXPO_TOKEN in the android-beta GitHub environment."
            exit 1
          fi
          if [ -z "$EXPO_PUBLIC_API_URL" ]; then
            echo "::error::Set WORKLY_TEST_API_URL to the isolated backend API base URL."
            exit 1
          fi
          node -e '
            const raw = process.env.EXPO_PUBLIC_API_URL;
            const u = new URL(raw);
            if (u.protocol !== "https:" || !u.pathname.endsWith("/api") || !u.hostname.endsWith(".vercel.app")) {
              console.error("::error::WORKLY_TEST_API_URL must be an HTTPS beta Vercel URL ending in /api.");
              process.exit(1);
            }
          '
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify TypeScript
        run: npx tsc --noEmit
      - name: Verify lint
        run: npm run lint
      - name: Pass public beta API URL into remote Expo build
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const config = JSON.parse(fs.readFileSync("eas.json", "utf8"));
          config.build.preview.env = {
            ...(config.build.preview.env || {}),
            EXPO_PUBLIC_API_URL: process.env.EXPO_PUBLIC_API_URL
          };
          fs.writeFileSync("eas.json", JSON.stringify(config, null, 2) + "\n");
          NODE
      - name: Create or link WORKLY project in Expo
        run: npx --yes eas-cli@16.28.0 init --account maia239 --non-interactive
      - name: Build Android APK
        run: npx --yes eas-cli@16.28.0 build --platform android --profile preview --non-interactive --wait
