name: Apply backend geofence enforcement

on:
  push:
    branches:
      - "agent/backend-geofence-enforcement"
    paths:
      - ".github/workflows/apply-backend-geofence.yml"

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/backend-geofence-enforcement

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patch FastAPI geofence enforcement
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/app/main.py")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              if old not in text:
                  raise SystemExit(f"Expected patch anchor not found: {old[:80]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              "import json\nimport os",
              "import json\nimport math\nimport os",
          )
          replace_once(
              "TOKEN_TTL_SECONDS = 60 * 60 * 24 * 14\nTOKEN_SECRET = os.getenv(",
              "TOKEN_TTL_SECONDS = 60 * 60 * 24 * 14\nGEOFENCE_RADIUS_M = 250.0\nTOKEN_SECRET = os.getenv(",
          )
          replace_once(
              '''def _now_iso() -> str:\n    return time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())\n\n\ndef _company_id_for_worker''',
              '''def _now_iso() -> str:\n    return time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())\n\n\ndef _distance_meters(\n    latitude_a: float,\n    longitude_a: float,\n    latitude_b: float,\n    longitude_b: float,\n) -> float:\n    earth_radius = 6_371_000.0\n    latitude_delta = math.radians(latitude_b - latitude_a)\n    longitude_delta = math.radians(longitude_b - longitude_a)\n    value = (\n        math.sin(latitude_delta / 2) ** 2\n        + math.cos(math.radians(latitude_a))\n        * math.cos(math.radians(latitude_b))\n        * math.sin(longitude_delta / 2) ** 2\n    )\n    return earth_radius * 2 * math.atan2(math.sqrt(value), math.sqrt(1 - value))\n\n\ndef _company_id_for_worker''',
          )
          replace_once(
              '''        project = _find("projects", project_id)\n        record = {''',
              '''        project = _find("projects", project_id)\n        distance_m: float | None = None\n        within_geofence: bool | None = None\n        if data.location_mode == "gps":\n            if data.latitude is None or data.longitude is None:\n                raise HTTPException(\n                    status_code=422,\n                    detail="Localização GPS incompleta para validar a entrada.",\n                )\n            project_latitude = project.get("latitude")\n            project_longitude = project.get("longitude")\n            if project_latitude is not None and project_longitude is not None:\n                distance_m = _distance_meters(\n                    data.latitude,\n                    data.longitude,\n                    float(project_latitude),\n                    float(project_longitude),\n                )\n                within_geofence = distance_m <= GEOFENCE_RADIUS_M\n                if not within_geofence:\n                    raise HTTPException(\n                        status_code=422,\n                        detail=(\n                            "Check-in fora da zona autorizada da obra "\n                            f"({round(distance_m)} m; máximo {round(GEOFENCE_RADIUS_M)} m)."\n                        ),\n                    )\n        record = {''',
          )
          replace_once(
              '''            "longitude": data.longitude\n            if data.longitude is not None\n            else project.get("longitude"),\n            "note": data.note or "Entrada registada na demonstração.",''',
              '''            "longitude": data.longitude\n            if data.longitude is not None\n            else project.get("longitude"),\n            "distance_m": distance_m,\n            "within_geofence": within_geofence,\n            "note": data.note or "Entrada registada na demonstração.",''',
          )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Install backend test dependencies
        run: python -m pip install -r requirements.txt pytest httpx

      - name: Run backend tests
        run: pytest -q backend/tests

      - name: Commit backend enforcement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/main.py
          git diff --cached --quiet && exit 0
          git commit -m "Enforce attendance geofence in FastAPI"
          git push origin HEAD:agent/backend-geofence-enforcement
