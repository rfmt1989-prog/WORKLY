name: Build V1 Final Polish

on:
  push:
    branches:
      - agent/v1-final-polish
    paths:
      - scripts/apply_v1_final_polish.py
      - .github/workflows/v1-final-polish.yml

permissions:
  contents: write

env:
  PYTHONPATH: .

jobs:
  polish-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1-final-polish
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply final polish
        run: python scripts/apply_v1_final_polish.py
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Test backend
        run: pytest -q backend/tests
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Lint with zero warnings
        working-directory: frontend
        run: npm run lint -- --max-warnings=0
      - name: Export web
        working-directory: frontend
        run: npm run build:web
      - name: Commit product changes and remove migration tooling
        run: |
          git config user.name "WORKLY Agent"
          git config user.email "actions@users.noreply.github.com"
          git add frontend
          git rm scripts/apply_v1_final_polish.py .github/workflows/v1-final-polish.yml
          git commit -m "Polish WORKLY V1 frontend quality"
          git push origin HEAD:agent/v1-final-polish
