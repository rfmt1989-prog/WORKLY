name: Frontend Verify

on:
  pull_request:
    paths:
      - "frontend/**"
      - "vercel.json"
      - ".github/workflows/frontend-verify.yml"
      - "scripts/apply_timesheet_attendance.py"
      - "scripts/apply_timesheet_access_copy.py"
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "frontend/**"
      - "vercel.json"
      - ".github/workflows/frontend-verify.yml"
      - "scripts/apply_timesheet_attendance.py"
      - "scripts/apply_timesheet_access_copy.py"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/timesheets-approval
          fetch-depth: 0

      - name: Apply timesheet attendance UI
        working-directory: .
        run: |
          if [ -f scripts/apply_timesheet_attendance.py ]; then
            python scripts/apply_timesheet_attendance.py
          fi
          if [ -f scripts/apply_timesheet_access_copy.py ]; then
            python scripts/apply_timesheet_access_copy.py
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Export web
        run: npm run build:web

      - name: Materialize validated timesheet UI
        if: github.event_name == 'pull_request' && hashFiles('scripts/apply_timesheet_attendance.py') != ''
        working-directory: .
        run: |
          git config user.name "WORKLY Agent"
          git config user.email "actions@users.noreply.github.com"
          git add frontend
          git rm scripts/apply_timesheet_attendance.py scripts/apply_timesheet_access_copy.py
          git checkout origin/main -- .github/workflows/frontend-verify.yml
          git add .github/workflows/frontend-verify.yml
          git commit -m "Integrate timesheet approval into attendance"
          git push origin HEAD:agent/timesheets-approval
