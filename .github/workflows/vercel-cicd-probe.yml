name: Probe Vercel CI credentials

on:
  push:
    branches:
      - "agent/vercel-cicd-probe"
    paths:
      - ".github/workflows/vercel-cicd-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check Vercel credential availability
        shell: bash
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN_AVAILABLE=true"
          else
            echo "VERCEL_TOKEN_AVAILABLE=false"
            exit 2
          fi
