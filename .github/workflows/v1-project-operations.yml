name: Build V1 Project Operations

on:
  push:
    branches:
      - agent/v1-project-operations
    paths:
      - scripts/apply_v1_project_ops.py
      - .github/workflows/v1-project-operations.yml

permissions:
  contents: write

env:
  PYTHONPATH: .

jobs:
  integrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1-project-operations
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply V1 operations integration
        run: python scripts/apply_v1_project_ops.py
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Compile backend
        run: python -m compileall -q backend api
      - name: Test backend
        run: pytest -q backend/tests
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Export web
        working-directory: frontend
        run: npm run build:web
      - name: Commit product changes and remove migration tooling
        run: |
          git config user.name "WORKLY Agent"
          git config user.email "actions@users.noreply.github.com"
          git add backend frontend
          git rm scripts/apply_v1_project_ops.py .github/workflows/v1-project-operations.yml
          git commit -m "Add project planning safety and cost control"
          git push origin HEAD:agent/v1-project-operations
