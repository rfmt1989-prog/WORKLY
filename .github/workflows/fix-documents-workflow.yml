name: Fix temporary document workflow

on:
  push:
    branches:
      - agent/documents-by-worker-project
    paths:
      - .github/workflows/fix-documents-workflow.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/documents-by-worker-project
      - name: Align backend tests with permanent CI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/documents-reorg-apply.yml')
          text = path.read_text()
          old = '          pytest -q backend/tests\n'
          new = '          PYTHONPATH=. pytest -q backend/tests\n'
          if old not in text:
              raise SystemExit('Backend test command not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name "rfmt1989-prog"
          git config user.email "300776272+rfmt1989-prog@users.noreply.github.com"
          git add .github/workflows/documents-reorg-apply.yml
          git commit -m "Align document workflow backend tests"
          git push
