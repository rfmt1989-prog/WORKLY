    genericError: "Autentificarea a eșuat. Verifică datele și încearcă din nou.",
    demoBadge: "DEMO WEB",
    loading: "Restabilim sesiunea…",
  },
  de: {
    eyebrow: "VERNETZTER BETRIEB",
    title: "Die richtigen Menschen.\nJede Baustelle unter Kontrolle.",
    description: "Eine zentrale Ansicht für Mitarbeiter, Teams, Zeitpläne, Dokumente und die Ausführung vor Ort.",
    secure: "Persistente Sitzung",
    responsive: "Web und Mobil",
    gps: "GPS-Anwesenheit",
    login: "Anmelden",
    register: "Konto erstellen",
    worker: "Mitarbeiter",
    workerDescription: "Profil, Baustellen und Anwesenheit",
    company: "Unternehmen",
    companyDescription: "Teams und Betrieb",
    name: "Vollständiger Name",
    companyName: "Unternehmensname",
    email: "E-Mail",
    password: "Passwort",
    submitLogin: "Bei WORKLY anmelden",
    submitRegister: "Konto erstellen",
    divider: "oder ein vorbereitetes Konto verwenden",
    workerDemo: "Als Mitarbeiter Demo anmelden",
    companyDemo: "Als Unternehmen Demo anmelden",
    demoPassword: "Einheitliches Demo-Passwort",
    required: "Füllen Sie alle Felder aus.",
    genericError: "Anmeldung fehlgeschlagen. Prüfen Sie die Angaben und versuchen Sie es erneut.",
    demoBadge: "WEB-DEMO",
    loading: "Sitzung wird wiederhergestellt…",
  },
  nl: {
    eyebrow: "VERBONDEN OPERATIES",
    title: "De juiste mensen.\nElke bouwplaats onder controle.",
    description: "Eén overzicht voor werknemers, teams, roosters, documenten en uitvoering op locatie.",
    secure: "Blijvende sessie",
    responsive: "Web en mobiel",
    gps: "GPS-aanwezigheid",
    login: "Inloggen",
    register: "Account maken",
    worker: "Werknemer",
    workerDescription: "Profiel, bouwplaatsen en aanwezigheid",
    company: "Bedrijf",
    companyDescription: "Teams en operaties",
    name: "Volledige naam",
    companyName: "Bedrijfsnaam",
    email: "E-mail",
    password: "Wachtwoord",
    submitLogin: "Inloggen bij WORKLY",
    submitRegister: "Account maken",
    divider: "of gebruik een voorbereid account",
    workerDemo: "Inloggen als Werknemer Demo",
    companyDemo: "Inloggen als Bedrijf Demo",
    demoPassword: "Uniek demonstratiewachtwoord",
    required: "Vul alle velden in.",
    genericError: "Aanmelden is mislukt. Controleer de gegevens en probeer opnieuw.",
    demoBadge: "WEBDEMO",
    loading: "Sessie wordt hersteld…",
  },
'''
          marker = '} as const;\n\nfunction readableError'
          if marker not in login:
              raise SystemExit('Login labels insertion marker not found')
          login = login.replace('  },\n} as const;\n\nfunction readableError', '  },\n' + extra_labels + '} as const;\n\nfunction readableError', 1)
          login = login.replace('function readableError(message: string, language: Language) {', 'function readableError(message: string, language: LanguageCode) {', 1)

          language_block = re.compile(r'          <View style=\{styles\.languageSwitch\}>[\s\S]*?          </View>\n        </View>', re.M)
          replacement = '''          <LanguageSelector\n            language={language}\n            onChange={setLanguage}\n            accent={workspaceColors.blue}\n          />\n        </View>'''
          login, count = language_block.subn(replacement, login, count=1)
          if count != 1:
              raise SystemExit('Login language selector replacement failed')
          login_path.write_text(login)
          PY

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify backend
        shell: bash
        run: |
          python -m pip install -r requirements.txt pytest httpx
          PYTHONPATH=. python -m compileall -q backend api
          PYTHONPATH=. pytest -q backend/tests

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify frontend
        shell: bash
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npm run lint
          npm run build:web

      - name: Commit verified source changes
        shell: bash
        run: |
          git config user.name "rfmt1989-prog"
          git config user.email "300776272+rfmt1989-prog@users.noreply.github.com"
          git add frontend/src/context/WorklyDataContext.tsx frontend/src/components/workspace/ImmersiveWorkspaceShell.tsx frontend/app/login.tsx
          git commit -m "Enable multilingual selection across WORKLY"
          git push
